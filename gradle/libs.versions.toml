[versions]

conscrypt-openjdk = '2.5.2'
kotest-runner = '5.9.1'
protobuf-java = '4.34.0'
grpc-protoc-plugin = '1.79.0'
micronaut = '5.0.0-M26'
micronaut-platform = '4.10.13'
micronaut-gradle-plugin = '4.6.2'
micronaut-grpc = '4.12.0'
micronaut-multitenancy = '5.8.0'
micronaut-validation = '5.0.0-M2'
micronaut-reactor = '4.0.0-M2'
micronaut-serde = '3.0.0-M8'
micronaut-test-resources = '2.10.1'

managed-pulsar-client = '4.1.3'

[libraries]
# Core
micronaut-core = { module = 'io.micronaut:micronaut-core-bom', version.ref = 'micronaut' }

# Micronaut BOMS
micronaut-grpc = { module = 'io.micronaut.grpc:micronaut-grpc-bom', version.ref = 'micronaut-grpc' }
micronaut-multitenancy = { module = 'io.micronaut.multitenancy:micronaut-multitenancy-bom', version.ref = 'micronaut-multitenancy' }
micronaut-reactor = { module = 'io.micronaut.reactor:micronaut-reactor-bom', version.ref = 'micronaut-reactor' }
micronaut-serde = { module = 'io.micronaut.serde:micronaut-serde-bom', version.ref = 'micronaut-serde' }
micronaut-test-resources = { module = 'io.micronaut.testresources:micronaut-test-resources-bom', version.ref = 'micronaut-test-resources' }
micronaut-validation = { module = 'io.micronaut.validation:micronaut-validation-bom', version.ref = 'micronaut-validation' }

# Managed libraries
managed-pulsar-client = { module = 'org.apache.pulsar:pulsar-client-original', version.ref= 'managed-pulsar-client' }

# Other libraries
conscrypt-openjdk = { module = "org.conscrypt:conscrypt-openjdk-uber", version.ref="conscrypt-openjdk" }
protobuf-java = { module = 'com.google.protobuf:protobuf-java', version.ref = 'protobuf-java' }
protobuf-grpc = { module = 'io.grpc:protoc-gen-grpc-java', version.ref = 'grpc-protoc-plugin' }
protobuf-protoc = { module = 'com.google.protobuf:protoc', version.ref = 'protobuf-java' }

kotest-runner = { module = 'io.kotest:kotest-runner-junit5', version.ref = 'kotest-runner' }
testcontainers-pulsar = { module = 'org.testcontainers:pulsar' }
gradle-micronaut = { module = "io.micronaut.gradle:micronaut-gradle-plugin", version.ref = 'micronaut-gradle-plugin' }
