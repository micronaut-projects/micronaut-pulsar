plugins {
    id("io.micronaut.build.internal.pulsar-base")
    id("io.micronaut.build.internal.python")
}

dependencies {
    // The Java helpers in src/test/java (example.PythonRuntimeInitializer) are processed by javac
    testAnnotationProcessor(platform(mn.micronaut.core.bom))
    testAnnotationProcessor(mn.micronaut.inject.java)
    // The Python compiler takes the (jar-resolved) compile classpath as its annotation processor path,
    // so the Micronaut processors of the Python sources are testImplementation (not testAnnotationProcessor).
    testImplementation(mn.micronaut.inject.python.test)
    testImplementation(mn.micronaut.context.python)
    testImplementation(projects.micronautPulsar)
    testImplementation(mnSerde.micronaut.serde.jackson)
    testImplementation(mnTest.micronaut.test.junit5)
    // io.micronaut.pulsar.shared.PulsarTestConfigurer starts the Pulsar test container of the example tests
    testImplementation(projects.testSuite.micronautTestPulsarSharedModule)
    testRuntimeOnly(mnLogging.logback.classic)
    testRuntimeOnly(mnTest.junit.jupiter.engine)
    testRuntimeOnly(mnTest.junit.platform.launcher)
}

// TODO(python): the documentation classes live in src/main/python (the `source="main"` snippets) and the
// tests in src/test/python. Compiling them separately yields two GraalPy VFS roots whose generated shim
// modules shadow each other at test time, and the Python compiler resolves the imports of a source file
// only within its own source root, so both roots are merged into one directory compiled with the tests.
def mergedPythonSources = tasks.register("mergePythonSources", Sync) {
    from(layout.projectDirectory.dir("src/main/python"))
    from(layout.projectDirectory.dir("src/test/python"))
    into(layout.buildDirectory.dir("merged-python-sources"))
}
tasks.named("compilePython") {
    enabled = false
}
tasks.named("compileTestPython") {
    dependsOn(mergedPythonSources)
    source.setFrom(mergedPythonSources.map { it.destinationDir })
}

tasks.withType(Test).configureEach {
    systemProperty "micronaut.python.pool.enabled", "false"
}
