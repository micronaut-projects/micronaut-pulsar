import org.jetbrains.kotlin.gradle.dsl.JvmTarget
plugins {
    id("io.micronaut.build.internal.pulsar-example")
    id "org.jetbrains.kotlin.jvm"
    id("org.jetbrains.kotlin.kapt")
}
micronaut {
    version libs.versions.micronaut.platform.get()
}
dependencies {
    kaptTest enforcedPlatform(mn.micronaut.core.bom)
    kaptTest mn.micronaut.inject.java

    testImplementation projects.micronautPulsar
    testImplementation libs.kotest.runner
    testImplementation libs.kotlin.reflect
    testImplementation libs.kotlin.stdlib.jdk8
    testImplementation(mnTestResources.testcontainers.core)
    implementation mn.kotlinx.coroutines.core
    implementation mn.kotlinx.coroutines.jdk8
}

tasks.named('test') {
    systemProperties['junit.jupiter.execution.parallel.enabled'] = true
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
    forkEvery = 1
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}
