plugins {
    id("io.micronaut.build.internal.pulsar-example")
    id "groovy"
}
micronaut {
    version libs.versions.micronaut.platform.get()
}

dependencies {
    testImplementation projects.micronautPulsar

    testCompileOnly mn.micronaut.inject.groovy
    testImplementation mn.micronaut.inject
    testImplementation mnTest.micronaut.test.spock
}

tasks.withType(GroovyCompile).configureEach {
    groovyOptions.forkOptions.jvmArgs.add('-Dgroovy.parameters=true')
}

//TODO remove once Micronaut Test ships Spock version compatible with Groovy 5
configurations.all {
    resolutionStrategy {
        force("org.spockframework:spock-core:2.4-groovy-5.0")

    }
}
