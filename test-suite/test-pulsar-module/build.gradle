plugins {
    id 'io.micronaut.build.internal.test-pulsar-module'
    id 'com.google.protobuf' version '0.9.5'
}

sourceSets {
    main {
        java {
            srcDirs(
                "build/generated/source/proto/main/grpc",
                "build/generated/source/proto/main/java"
            )
        }
    }
    test {
        resources {
            srcDir '../test-pulsar-shared-module/src/test/resources'
            include 'broker.cert.pem', 'broker.key-pk8.pem', 'ca.cert.pem', 'standalone.conf', 'client.conf'
        }
    }
}

protobuf {
    protoc {
        artifact = "${libs.protobuf.protoc.get().toString()}"
    }
    plugins {
        grpc {
            artifact = "${libs.protobuf.grpc.get().toString()}"
        }
    }
    generateProtoTasks {
        all().configureEach {
            plugins {
                grpc{}
            }
        }
    }
}

tasks.getByName("classes").dependsOn("generateProto")
//TODO remove once Micronaut Test ships Spock version compatible with Groovy 5
configurations.all {
    resolutionStrategy {
        force("org.spockframework:spock-core:2.4-groovy-5.0")
    }
}
